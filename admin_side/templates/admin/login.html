<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login | Smart Internship</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    
    <style>
        /* Login Page Specific Styles */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gray-900) 0%, var(--gray-800) 50%, var(--primary-900) 100%);
            padding: var(--space-6);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            padding: var(--space-8);
            text-align: center;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-4);
            font-size: 2rem;
            color: white;
        }

        .login-header h1 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: var(--space-2);
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
        }

        /* Role Toggle Tabs */
        .role-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }

        .role-tab {
            flex: 1;
            padding: var(--space-4);
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
            background: transparent;
            position: relative;
        }

        .role-tab:hover {
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.03);
        }

        .role-tab.active {
            color: var(--primary-600);
            background: var(--bg-primary);
        }

        .role-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-500), var(--primary-600));
            border-radius: 3px 3px 0 0;
        }

        .role-tab i {
            display: block;
            font-size: 1.25rem;
            margin-bottom: var(--space-1);
        }

        /* Login Form */
        .login-form {
            padding: var(--space-8);
        }

        .login-form .form-group {
            margin-bottom: var(--space-5);
        }

        .login-form .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .login-form .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            font-size: 0.9375rem;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .login-form .form-control:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(52, 117, 215, 0.15);
        }

        .login-form .form-control::placeholder {
            color: var(--text-muted);
        }

        .login-error {
            background: var(--error-light);
            color: var(--error-dark);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .login-success {
            background: var(--success-light);
            color: var(--success-dark);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-5);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .btn-lg {
            padding: var(--space-4) var(--space-6);
            font-size: 1rem;
        }

        .w-full {
            width: 100%;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
            font-size: 0.875rem;
        }

        .remember-row label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            cursor: pointer;
            color: var(--text-secondary);
        }

        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-500);
        }

        .remember-row a {
            color: var(--primary-600);
        }

        .login-footer {
            padding: var(--space-6) var(--space-8);
            background: var(--bg-secondary);
            text-align: center;
            border-top: 1px solid var(--border-light);
        }

        .login-footer p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: var(--space-3);
        }

        .login-footer a {
            color: var(--primary-600);
            font-weight: 500;
        }

        /* Role indicator hidden input */
        #role-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>Smart Internship</h1>
                <p>Sign in to access your dashboard</p>
            </div>
            
            <!-- Role Toggle Tabs -->
            <div class="role-tabs">
                <button type="button" class="role-tab active" data-role="STUDENT" onclick="switchRole('STUDENT')">
                    <i class="fas fa-user-graduate"></i>
                    Student
                </button>
                <button type="button" class="role-tab" data-role="COORDINATOR" onclick="switchRole('COORDINATOR')">
                    <i class="fas fa-chalkboard-teacher"></i>
                    Coordinator
                </button>
                <button type="button" class="role-tab" data-role="ADMIN" onclick="switchRole('ADMIN')">
                    <i class="fas fa-user-shield"></i>
                    Admin
                </button>
            </div>
            
            <form method="post" action="" class="login-form">
                {% csrf_token %}
                
                <!-- Hidden role input -->
                <input type="hidden" name="role" id="role-input" value="STUDENT">
                
                {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}
                
                {% if error %}
                <div class="login-error">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ error }}
                </div>
                {% endif %}
                
                {% if success %}
                <div class="login-success">
                    <i class="fas fa-check-circle"></i>
                    {{ success }}
                </div>
                {% endif %}
                
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-user" style="margin-right: 8px;"></i>
                        Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="Enter your username" 
                           required 
                           autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock" style="margin-right: 8px;"></i>
                        Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Enter your password" 
                           required 
                           autocomplete="current-password">
                </div>
                
                <div class="remember-row">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-full">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>
            
            <div class="login-footer" id="student-register-link">
                <p>Don't have an account?</p>
                <a href="{% url 'register' %}">Register as Student</a>
            </div>
        </div>
    </div>

    <script>
        function switchRole(role) {
            // Update hidden input
            document.getElementById('role-input').value = role;
            
            // Update active tab
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-role="${role}"]`).classList.add('active');
            
            // Show/hide register link (only for students)
            const registerLink = document.getElementById('student-register-link');
            if (role === 'STUDENT') {
                registerLink.style.display = 'block';
            } else {
                registerLink.style.display = 'none';
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            switchRole('STUDENT');
        });
    </script>
</body>
</html>
