{% extends 'coordinator/base.html' %}

{% block title %}Edit Course{% endblock %}
{% block page_title %}Edit Course: {{ course.name }}{% endblock %}

{% block content %}
<div class="d-flex items-center gap-2 mb-6">
    <a href="{% url 'coordinator:courses' %}" class="text-muted" style="font-size: 0.875rem;">
        <i class="fas fa-graduation-cap"></i> Courses
    </a>
    <i class="fas fa-chevron-right text-muted" style="font-size: 0.75rem;"></i>
    <span style="font-size: 0.875rem;">Edit Course</span>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">
            <i class="fas fa-edit" style="color: var(--warning-500); margin-right: 8px;"></i>
            Update Course Details
        </h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="name">Course Name <span style="color: var(--error);">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" value="{{ course.name }}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="category">Category <span style="color: var(--error);">*</span></label>
                    <select id="category" name="category" class="form-control" required>
                        {% for code, name in categories %}
                        <option value="{{ code }}" {% if course.category == code %}selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ course.description }}</textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="duration_days">Duration (Days)</label>
                    <input type="number" id="duration_days" name="duration_days" class="form-control" value="{{ course.duration_days }}" min="1">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="max_students">Max Students</label>
                    <input type="number" id="max_students" name="max_students" class="form-control" value="{{ course.max_students }}" min="1">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="start_date">Start Date</label>
                    <input type="date" id="start_date" name="start_date" class="form-control" value="{{ course.start_date|date:'Y-m-d' }}">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="end_date">End Date</label>
                    <input type="date" id="end_date" name="end_date" class="form-control" value="{{ course.end_date|date:'Y-m-d' }}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="eligibility">Eligibility Criteria</label>
                <textarea id="eligibility" name="eligibility" class="form-control" rows="2">{{ course.eligibility }}</textarea>
            </div>

            <div class="d-flex gap-4 mt-6">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Update Course
                </button>
                <a href="{% url 'coordinator:courses' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
