<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register | Smart Internship</title>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    
    <style>
        /* Registration Page Specific Styles */
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gray-900) 0%, var(--gray-800) 50%, var(--primary-900) 100%);
            padding: var(--space-6);
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        .register-header {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            padding: var(--space-6);
            text-align: center;
        }

        .register-logo {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-3);
            font-size: 1.75rem;
            color: white;
        }

        .register-header h1 {
            color: white;
            font-size: 1.25rem;
            margin-bottom: var(--space-1);
        }

        .register-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
        }

        /* Register Form */
        .register-form {
            padding: var(--space-6);
        }

        .register-form .form-group {
            margin-bottom: var(--space-4);
        }

        .register-form .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .register-form .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            font-size: 0.9375rem;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .register-form .form-control:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(52, 117, 215, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .error-list {
            background: var(--error-light);
            color: var(--error-dark);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
            font-size: 0.875rem;
        }

        .error-list ul {
            margin: 0;
            padding-left: var(--space-4);
        }

        .error-list li {
            margin-bottom: var(--space-1);
        }

        .btn-lg {
            padding: var(--space-4) var(--space-6);
            font-size: 1rem;
        }

        .w-full {
            width: 100%;
        }

        .register-footer {
            padding: var(--space-5) var(--space-6);
            background: var(--bg-secondary);
            text-align: center;
            border-top: 1px solid var(--border-light);
        }

        .register-footer p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .register-footer a {
            color: var(--primary-600);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <div class="register-header">
                <div class="register-logo">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h1>Student Registration</h1>
                <p>Create your account to get started</p>
            </div>
            
            <form method="post" action="" class="register-form">
                {% csrf_token %}
                
                {% if errors %}
                <div class="error-list">
                    <ul>
                        {% for error in errors %}
                        <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
                {% endif %}
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="first_name">
                            First Name
                        </label>
                        <input type="text" 
                               id="first_name" 
                               name="first_name" 
                               class="form-control" 
                               placeholder="First name"
                               value="{{ form_data.first_name|default:'' }}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="last_name">
                            Last Name
                        </label>
                        <input type="text" 
                               id="last_name" 
                               name="last_name" 
                               class="form-control" 
                               placeholder="Last name"
                               value="{{ form_data.last_name|default:'' }}">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-user" style="margin-right: 8px;"></i>
                        Username *
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="Choose a username" 
                           required
                           value="{{ form_data.username|default:'' }}">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope" style="margin-right: 8px;"></i>
                        Email Address *
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           class="form-control" 
                           placeholder="Enter your email" 
                           required
                           value="{{ form_data.email|default:'' }}">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">
                        <i class="fas fa-phone" style="margin-right: 8px;"></i>
                        Phone Number
                    </label>
                    <input type="tel" 
                           id="phone" 
                           name="phone" 
                           class="form-control" 
                           placeholder="Enter your phone number"
                           value="{{ form_data.phone|default:'' }}">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="institution">
                        <i class="fas fa-building" style="margin-right: 8px;"></i>
                        Institution *
                    </label>
                    <select id="institution" 
                            name="institution" 
                            class="form-control" 
                            required>
                        <option value="">Select your institution</option>
                        {% for inst in institutions %}
                        <option value="{{ inst.id }}" {% if form_data.institution == inst.id|stringformat:"s" %}selected{% endif %}>
                            {{ inst.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="password">
                            <i class="fas fa-lock" style="margin-right: 8px;"></i>
                            Password *
                        </label>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-control" 
                               placeholder="Min 6 characters" 
                               required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirm_password">
                            <i class="fas fa-lock" style="margin-right: 8px;"></i>
                            Confirm Password *
                        </label>
                        <input type="password" 
                               id="confirm_password" 
                               name="confirm_password" 
                               class="form-control" 
                               placeholder="Confirm password" 
                               required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top: var(--space-4);">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>
            </form>
            
            <div class="register-footer">
                <p>Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
