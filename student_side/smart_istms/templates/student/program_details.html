{% extends 'student/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white p-4">
                    <h2 class="fw-bold mb-1">{{ program.title }}</h2>
                    <p class="mb-0 opacity-75"><i class="fas fa-building me-2"></i>{{ program.institution_name }}</p>
                </div>
                
                <div class="card-body p-4">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="text-muted small fw-bold text-uppercase">Location</label>
                            <p class="text-dark"><i class="fas fa-map-marker-alt text-primary me-2"></i>{{ program.location }}</p>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small fw-bold text-uppercase">Program Type</label>
                            <p class="text-dark"><i class="fas fa-briefcase text-primary me-2"></i>Internship / Training</p>
                        </div>
                    </div>

                    <h5 class="fw-bold text-primary mb-3">About this Program</h5>
                    <div class="text-gray-800 mb-5" style="line-height: 1.7;">
                        {{ program.description|linebreaks }}
                    </div>

                    <div class="d-flex gap-3 pt-4 border-top">
                        <a href="javascript:history.back()" class="btn btn-light px-4 border">Cancel</a>
                        <a href="{% url 'apply_now' program.id %}" class="btn btn-primary px-5 fw-bold shadow-sm">
                            Apply for this Program
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
